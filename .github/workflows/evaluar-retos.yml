name: Evaluar Retos

on:
  pull_request:
    branches: [main]
    paths:
      # Retos de módulos Python (compatibilidad con el currículum actual)
      - 'python/**/reto.py'
      - 'python/**/test_reto*.py'
      - 'python/**/radar.py'
      - 'python/**/filtro.py'
      - 'python/**/alarma.py'
      - 'python/**/mesero.py'
      - 'python/**/cocina.py'
      - 'python/**/hub_fortaleza.py'
      - 'python/**/cliente_legal.py'
      - 'python/**/sensor.py'
      - 'python/**/hub_estricto.py'
      - 'python/**/nerve.config'
      # Retos de Rust, Go, Java y JS. Cada lenguaje puede tener su propia
      # estructura de proyecto (por ejemplo, src/, Cargo.toml o pom.xml).
      - 'rust/**/*.rs'
      - 'rust/**/Cargo.toml'
      - 'rust/**/Cargo.lock'
      - 'go/**/*.go'
      - 'go/**/go.mod'
      - 'go/**/go.sum'
      - 'java/**/*.java'
      - 'java/**/pom.xml'
      - 'java/**/build.gradle'
      - 'java/**/build.gradle.kts'
      - 'java/**/settings.gradle'
      - 'java/**/settings.gradle.kts'
      - 'js/**/*.js'
      - 'js/**/*.ts'
      - 'js/**/package.json'
      - 'js/**/package-lock.json'
      # Retos socráticos por lenguaje
      - 'retos/python/**/reto.py'
      - 'retos/rust/**/*.rs'
      - 'retos/rust/**/Cargo.toml'
      - 'retos/rust/**/Cargo.lock'
      - 'retos/go/**/*.go'
      - 'retos/go/**/go.mod'
      - 'retos/go/**/go.sum'
      - 'retos/java/**/*.java'
      - 'retos/java/**/pom.xml'
      - 'retos/java/**/build.gradle'
      - 'retos/java/**/build.gradle.kts'
      - 'retos/java/**/settings.gradle'
      - 'retos/java/**/settings.gradle.kts'
      - 'retos/js/**/*.js'
      - 'retos/js/**/*.ts'
      - 'retos/js/**/package.json'
      - 'retos/js/**/package-lock.json'

jobs:
  # ─────────────────────────────────────────────
  # Evaluar retos modificados en el PR y comentar el resultado.
  # Este job es el "required status check" de la rama main.
  # ─────────────────────────────────────────────
  evaluar:
    name: Evaluacion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Clonar repo del alumno
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar archivos modificados en el PR
        id: detectar
        run: |
          archivos=$(git diff --name-only \
            "origin/${{ github.event.pull_request.base.ref }}"...HEAD 2>/dev/null || echo "")

          relevantes=$(echo "$archivos" | grep -E '^(python|rust|go|java|js)/|^retos/(python|rust|go|java|js)/' || true)

          if [ -z "$(echo "$relevantes" | tr -d '[:space:]')" ]; then
            echo "Sin cambios relevantes."
            echo "archivos=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "archivos<<EOF"
            echo "$relevantes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Archivos de retos a evaluar:"
          echo "$relevantes"

      - name: Descargar tests oficiales de nerve-community
        if: steps.detectar.outputs.archivos != ''
        run: |
          git clone --depth 1 --no-checkout \
            https://github.com/nerve-learning/nerve-community.git \
            /tmp/nerve-community

          cd /tmp/nerve-community
          git sparse-checkout init --cone
          git sparse-checkout set python rust go java js retos
          git checkout

          echo ""
          echo "── Verificación: contenido de nerve-community ──"
          if [ -d /tmp/nerve-community/python ]; then
            echo "python/ existe. Módulos y niveles encontrados:"
            find /tmp/nerve-community/python -maxdepth 2 -mindepth 1 -type d | sort
          else
            echo "⚠️ ADVERTENCIA: /tmp/nerve-community/python NO existe."
            echo "Contenido real de /tmp/nerve-community:"
            ls -la /tmp/nerve-community
          fi

      - name: Configurar Python 3.12
        if: steps.detectar.outputs.archivos != ''
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias base
        if: always() && steps.detectar.outputs.archivos != ''
        continue-on-error: true
        run: pip install -q pytest requests beautifulsoup4 aiohttp scikit-learn matplotlib

      - name: Configurar Go
        if: steps.detectar.outputs.archivos != ''
        continue-on-error: true
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Configurar Java
        if: steps.detectar.outputs.archivos != ''
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Rust
        if: steps.detectar.outputs.archivos != ''
        continue-on-error: true
        uses: dtolnay/rust-toolchain@stable

      - name: Configurar Node.js
        if: steps.detectar.outputs.archivos != ''
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Ejecutar evaluaciones
        id: ejecutar
        if: always() && steps.detectar.outputs.archivos != ''
        run: |
          archivos="${{ steps.detectar.outputs.archivos }}"
          fallo=0
          pasan=0
          fallan=0
          evaluadas=""

          echo "## 🧪 Resultado de evaluación Nerve" > resultado_pr.md
          echo "" >> resultado_pr.md

          for archivo in $archivos; do
            [ -f "$archivo" ] || continue

            carpeta=$(dirname "$archivo")
            carpeta_original="$carpeta"
            while [ "$carpeta" != "." ] && [ "$carpeta" != "/" ]; do
              oficial="/tmp/nerve-community/$carpeta"
              if [ -f "$oficial/evaluador.sh" ] || [ -f "$oficial/test_main.py" ]; then
                break
              fi
              carpeta=$(dirname "$carpeta")
            done

            if [ "$carpeta" = "." ] || [ "$carpeta" = "/" ]; then
              echo "- ⚠️ No se encontró evaluador oficial para \`$archivo\`" >> resultado_pr.md
              echo "  <details><summary>Detalle técnico</summary>" >> resultado_pr.md
              echo "" >> resultado_pr.md
              echo '  ```' >> resultado_pr.md
              echo "  Se buscó (sin éxito) evaluador.sh o test_main.py en:" >> resultado_pr.md
              echo "  /tmp/nerve-community/$carpeta_original" >> resultado_pr.md
              echo "  y en cada carpeta padre hasta la raíz." >> resultado_pr.md
              echo "  Verifica que esa ruta exista tal cual (mayúsculas/guiones)" >> resultado_pr.md
              echo "  dentro del repo nerve-community." >> resultado_pr.md
              echo '  ```' >> resultado_pr.md
              echo "  </details>" >> resultado_pr.md
              fallo=1
              continue
            fi

            case " $evaluadas " in
              *" $carpeta "*) continue ;;
            esac
            evaluadas="$evaluadas $carpeta"

            [ -d "$carpeta" ] || { echo "- ⚠️ No existe el reto: \`$carpeta\`" >> resultado_pr.md; fallo=1; continue; }

            nivel=$(basename "$carpeta")
            lenguaje=$(echo "$carpeta" | cut -d'/' -f1)

            if echo "$carpeta" | grep -q '^retos/'; then
              grupo=$(echo "$carpeta" | cut -d'/' -f1-3)
              label="[RETO SOCRÁTICO] $grupo / $nivel"
            else
              modulo=$(basename "$(dirname "$carpeta")")
              label="[$lenguaje] $modulo / $nivel"
            fi

            echo ""
            echo "--- $label ---"

            evaluador="/tmp/nerve-community/$carpeta/evaluador.sh"
            test_oficial="/tmp/nerve-community/$carpeta/test_main.py"
            salida_test=$(mktemp)

            if [ -f "$carpeta/requirements.txt" ]; then
              pip install -q -r "$carpeta/requirements.txt"
            fi

            resultado=1
            if [ -f "$evaluador" ]; then
              if (cd "/tmp/nerve-community/$carpeta" && bash ./evaluador.sh "$GITHUB_WORKSPACE/$carpeta") > "$salida_test" 2>&1; then
                resultado=0
              else
                resultado=$?
              fi
            elif [ "$lenguaje" = "python" ] && [ -f "$test_oficial" ]; then
              cp "$test_oficial" "$carpeta/test_main.py"
              if python -m pytest "$carpeta/test_main.py" -v --tb=short --no-header > "$salida_test" 2>&1; then
                resultado=0
              else
                resultado=$?
              fi
              rm -f "$carpeta/test_main.py"
            else
              echo "  Falta evaluador oficial (evaluador.sh) para este reto." > "$salida_test"
            fi

            cat "$salida_test"

            if [ $resultado -eq 0 ]; then
              echo "  APROBADO"
              pasan=$((pasan + 1))
              echo "- ✅ **APROBADO** — $label" >> resultado_pr.md
            else
              echo "  REPROBADO"
              fallan=$((fallan + 1))
              fallo=1
              {
                echo "- ❌ **REPROBADO** — $label"
                echo "  <details><summary>Ver detalle</summary>"
                echo ""
                echo '  ```'
                tail -n 25 "$salida_test" | sed 's/^/  /'
                echo '  ```'
                echo "  </details>"
              } >> resultado_pr.md
            fi
            rm -f "$salida_test"
          done

          {
            echo ""
            echo "---"
            echo "**Resumen: $pasan aprobado(s) / $fallan reprobado(s)**"
          } >> resultado_pr.md

          cat resultado_pr.md >> "$GITHUB_STEP_SUMMARY"

          [ $fallo -eq 0 ] || exit 1

      - name: Garantizar resultado_pr.md
        if: always() && steps.detectar.outputs.archivos != ''
        run: |
          if [ ! -s resultado_pr.md ]; then
            echo "## 🧪 Resultado de evaluación Nerve" > resultado_pr.md
            echo "" >> resultado_pr.md
            echo "⚠️ Hubo un error interno al ejecutar la evaluación (falló antes de poder correr los tests). Reintenta el push, o avisa al staff si sigue fallando." >> resultado_pr.md
          fi

      - name: Comentar resultado en el PR
        if: always() && steps.detectar.outputs.archivos != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: nerve-evaluacion
          path: resultado_pr.md